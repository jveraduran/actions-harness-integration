# ===========================================================================
#  hardening-reader-1-nodejs — build con gate de policy vía conftest
#  y despliegue vía Harness CD genérico
# ===========================================================================

name: build-and-deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Tag de la base image a inyectar (ej. v1.0.42). Vacío = usar el del git tag que disparó el workflow."
        required: false
        default: ""

env:
  REGISTRY: pkg.harness.io
  ACCOUNT_ID: UCBJyOkwRy69wQkDOgpexg
  HARNESS_ORG_ID: TPMDemos
  HARNESS_PROJECT_ID: devops
  REGISTRY_REF: harness-demo
  APP_REPO: pkg.harness.io/UCBJyOkwRy69wQkDOgpexg/harness-demo/hardening-reader-1-nodejs
  POLICY_ID: DEBUG

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_tag: ${{ steps.tag.outputs.app_tag }}
      base_tag: ${{ steps.base.outputs.base_tag }}
      app_repo: ${{ steps.repo.outputs.app_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver BASE_TAG
        id: base
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.base_tag }}" ]; then
            BASE_TAG="${{ github.event.inputs.base_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            BASE_TAG="${{ github.ref_name }}"
          else
            echo "::error::Este workflow espera un push de tag (v*) o un base_tag manual vía workflow_dispatch."
            exit 1
          fi
          echo "BASE_TAG resuelto: ${BASE_TAG}"
          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Calcular tag del artefacto
        id: tag
        run: |
          echo "app_tag=v.1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Normalizar el repo de la imagen a minúsculas
        id: repo
        run: |
          set -euo pipefail
          LOWER="$(echo "${APP_REPO}" | tr '[:upper:]' '[:lower:]')"
          if [ "${LOWER}" != "${APP_REPO}" ]; then
            echo "::warning::APP_REPO tenía mayúsculas ('${APP_REPO}'). Docker las rechaza en el repo (no en el tag). Usando '${LOWER}'."
          fi
          echo "app_repo=${LOWER}" >> "$GITHUB_OUTPUT"

      - name: Diagnóstico del secreto (sin exponerlo)
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${HARNESS_API_KEY:-}" ]; then
            echo "::error::El secreto HARNESS_API_KEY llegó VACÍO a este step."
            exit 1
          fi

          LEN="${#HARNESS_API_KEY}"
          PREFIX="${HARNESS_API_KEY:0:4}"
          echo "Longitud: ${LEN} caracteres. Empieza por: '${PREFIX}'"

          case "${HARNESS_API_KEY}" in
            pat.*|sat.*) echo "Formato OK (pat./sat.)" ;;
            *)
              echo "::warning::No empieza por 'pat.' ni 'sat.' — probablemente no es un token de API de Harness."
              ;;
          esac

          TOKEN_ACCOUNT="$(echo "${HARNESS_API_KEY}" | cut -d'.' -f2)"
          if [ -n "${TOKEN_ACCOUNT}" ] && [ "${TOKEN_ACCOUNT}" != "${HARNESS_API_KEY}" ]; then
            TOKEN_ACCOUNT_LOWER="$(echo "${TOKEN_ACCOUNT}" | tr '[:upper:]' '[:lower:]')"
            ACCOUNT_ID_LOWER="$(echo "${ACCOUNT_ID}" | tr '[:upper:]' '[:lower:]')"

            if [ "${TOKEN_ACCOUNT_LOWER}" != "${ACCOUNT_ID_LOWER}" ]; then
              echo "::error::El token pertenece a la cuenta '${TOKEN_ACCOUNT}', pero ACCOUNT_ID configurado es '${ACCOUNT_ID}'."
              exit 1
            fi
          fi

      - name: Descargar policy desde Harness
        id: policy
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            "https://app.harness.io/gateway/pm/api/v1/policies/${POLICY_ID}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${HARNESS_ORG_ID}&projectIdentifier=${HARNESS_PROJECT_ID}" \
            -o policy_response.json || {
              CODE=$?
              echo "::error::curl falló (código ${CODE})."
              exit 1
            }

          jq -r '.rego' policy_response.json > image_policy.rego

          if [ ! -s image_policy.rego ] || [ "$(cat image_policy.rego)" = "null" ]; then
            echo "::error::La respuesta no trajo un campo .rego usable."
            exit 1
          fi
          echo "Policy '${POLICY_ID}' descargada."

      - name: Renderizar Dockerfile con BASE_TAG
        env:
          BASE_TAG_VALUE: ${{ steps.base.outputs.base_tag }}
        run: |
          set -euo pipefail
          echo "Tag a inyectar: ${BASE_TAG_VALUE}"
          sed "s|\${BASE_TAG}|${BASE_TAG_VALUE}|g" Dockerfile > rendered.Dockerfile
          echo "--- FROM resultante ---"
          grep -i '^FROM' rendered.Dockerfile || echo "(sin línea FROM — revisa el Dockerfile)"

      - name: Evaluar con conftest
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/project" -w /project \
            instrumenta/conftest:latest \
            test rendered.Dockerfile -p image_policy.rego

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_TAG=${{ steps.base.outputs.base_tag }}
          tags: ${{ steps.repo.outputs.app_repo }}:${{ steps.tag.outputs.app_tag }}

      - name: Resumen
        env:
          APP_REPO_LOWER: ${{ steps.repo.outputs.app_repo }}
        run: |
          {
            echo "### Artefacto publicado"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${APP_REPO_LOWER}:${{ steps.tag.outputs.app_tag }}\` |"
            echo "| BASE_TAG inyectado | \`${{ steps.base.outputs.base_tag }}\` |"
            echo "| Policy evaluada | \`${POLICY_ID}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  #  deploy — dispara el NUEVO pipeline de Harness (CD - Deploy con Policy Gate)
  # =========================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      HARNESS_PIPELINE_ID: cd_deploy_policy_gate
      APP_TAG: ${{ needs.build.outputs.app_tag }}
      APP_REPO: ${{ needs.build.outputs.app_repo }}
      
      ENV_TYPE: PreProduction
      # Mantengo los valores "TEST" basados en los logs de error que enviaste
      SERVICE_REF: TEST
      ENV_REF: TEST
      INFRA_DEF: TEST

    steps:
      - name: Obtener el template de runtime inputs del pipeline
        id: template
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        run: |
          set -euo pipefail
          FOUND_PREFIX=""
          HTTP_CODE=""
          for PREFIX in "/gateway" ""; do
            CODE="$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "x-api-key: ${HARNESS_API_KEY}" \
              -H "Content-Type: application/json" \
              "https://app.harness.io${PREFIX}/pipeline/api/inputSets/template?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${HARNESS_ORG_ID}&projectIdentifier=${HARNESS_PROJECT_ID}&pipelineIdentifier=${HARNESS_PIPELINE_ID}" \
              -d '{}')"
            HTTP_CODE="${CODE}"
            if [ "${CODE}" = "200" ]; then
              FOUND_PREFIX="${PREFIX}"
              break
            fi
          done

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Fallo obteniendo template. Código HTTP: ${HTTP_CODE}"
            cat response.json 2>/dev/null || true
            exit 1
          fi

          TEMPLATE_YAML="$(jq -r '.data.inputSetTemplateYaml // .inputSetTemplateYaml // empty' response.json)"
          echo "prefix=${FOUND_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "${TEMPLATE_YAML}" > template.yaml

      - name: Llenar el runtime_input.yaml
        id: build_input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import yaml

          with open("template.yaml") as f:
              template = yaml.safe_load(f)

          pipeline = template.get("pipeline", template) if isinstance(template, dict) else None
          
          APP_TAG = os.environ["APP_TAG"]
          APP_REPO = os.environ["APP_REPO"]
          IMAGE_PATH = APP_REPO.rstrip("/").rsplit("/", 1)[-1]
          ENV_TYPE = os.environ["ENV_TYPE"]

          # 1. Resolver las Pipeline Variables
          variables = pipeline.get("variables", [])
          for var in variables:
              name = var.get("name")
              val = str(var.get("value", ""))
              if name == "app_image_repo" and "<+input>" in val:
                  var["value"] = IMAGE_PATH
              elif name == "app_image_tag" and "<+input>" in val:
                  var["value"] = APP_TAG
              elif name == "env_type" and "<+input>" in val:
                  var["value"] = ENV_TYPE
              elif name == "change_number" and "<+input>" in val:
                  var["value"] = "" # Vacío por defecto
              elif name == "run_artifact_scan" and "<+input>" in val:
                  var["value"] = "true"

          # 2. Resolver los Stage Inputs (deploy)
          SERVICE_REF = os.environ["SERVICE_REF"]
          ENV_REF = os.environ["ENV_REF"]
          INFRA_DEF = os.environ["INFRA_DEF"]

          stages = pipeline.get("stages", [])
          for s in stages:
              st = s.get("stage", s)
              if st and st.get("identifier") == "deploy":
                  spec = st.get("spec", {})
                  
                  # Inyectar variables de Service FORZADAMENTE
                  service = spec.setdefault("service", {})
                  service["serviceRef"] = SERVICE_REF
                  
                  # Limpiar serviceInputs si viene como <+input>
                  if "serviceInputs" in service and service["serviceInputs"] == "<+input>":
                      del service["serviceInputs"]

                  # Inyectar variables de Environment FORZADAMENTE
                  env = spec.setdefault("environment", {})
                  env["environmentRef"] = ENV_REF
                  env["infrastructureDefinitions"] = [{"identifier": INFRA_DEF}]

          # 3. Validar que no queden <+input> sueltos
          def find_unresolved(node, path="pipeline"):
              found = []
              if isinstance(node, dict):
                  for k, v in node.items():
                      found += find_unresolved(v, f"{path}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      found += find_unresolved(v, f"{path}[{i}]")
              elif isinstance(node, str) and node.strip().startswith("<+input>"):
                  found.append((path, node))
              return found

          unresolved = find_unresolved(pipeline)
          if unresolved:
              print("::error::Quedaron runtime inputs sin resolver:")
              for path, value in unresolved:
                  print(f"  {path} = {value}")
              sys.exit(1)

          with open("runtime_input.yaml", "w") as f:
              yaml.safe_dump({"pipeline": pipeline}, f, sort_keys=False)
          print("runtime_input.yaml armado correctamente.")
          PY
          
          echo "--- runtime_input.yaml generado ---"
          cat runtime_input.yaml

      - name: Disparar el pipeline en Harness
        id: trigger
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        run: |
          set -euo pipefail
          PREFIX="${{ steps.template.outputs.prefix }}"

          BODY_FILE="$(mktemp)"
          jq -n --rawfile yaml runtime_input.yaml '{runtimeInputYaml: $yaml}' > "${BODY_FILE}"

          curl -sS --fail-with-body -o exec_response.json -X POST \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            -H "Content-Type: application/json" \
            "https://app.harness.io${PREFIX}/pipeline/api/pipeline/execute/${HARNESS_PIPELINE_ID}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${HARNESS_ORG_ID}&projectIdentifier=${HARNESS_PROJECT_ID}&moduleType=CD" \
            -d @"${BODY_FILE}" || {
              echo "::error::curl falló disparando el pipeline. Respuesta:"
              cat exec_response.json 2>/dev/null || true
              exit 1
            }

          EXEC_ID="$(jq -r '.data.planExecution.uuid // empty' exec_response.json)"
          echo "exec_id=${EXEC_ID}" >> "$GITHUB_OUTPUT"
          echo "Ejecución del pipeline disparada: ${EXEC_ID}"

      - name: Esperar resultado de la ejecución
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        run: |
          set -euo pipefail
          PREFIX="${{ steps.template.outputs.prefix }}"
          EXEC_ID="${{ steps.trigger.outputs.exec_id }}"

          for i in $(seq 1 120); do
            STATUS="$(curl -sS \
              -H "x-api-key: ${HARNESS_API_KEY}" \
              "https://app.harness.io${PREFIX}/pipeline/api/pipelines/execution/v2/${EXEC_ID}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${HARNESS_ORG_ID}&projectIdentifier=${HARNESS_PROJECT_ID}" \
              | jq -r '.data.pipelineExecutionSummary.status // "Unknown"')"

            echo "[$i] Estado: ${STATUS}"
            case "${STATUS}" in
              Success) exit 0 ;;
              Failed|Aborted|Errored|Expired|ApprovalRejected)
                echo "::error::La ejecución terminó en ${STATUS}."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timeout esperando la ejecución."
          exit 1